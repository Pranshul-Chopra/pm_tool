name: Release PM Tool

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.4.0 - leave empty to auto-detect from package.json)'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION=$(node -p "require('./electron/package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: ${TAG}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'electron/package-lock.json'

      - name: Install Electron dependencies
        working-directory: ./electron
        run: npm ci

      - name: Build Vite React SPA Frontend
        working-directory: ./electron
        run: npm run build:ui

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Flask backend with PyInstaller
        run: |
          python -m PyInstaller flask.spec --noconfirm

      - name: Package Desktop App with electron-builder
        working-directory: ./electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Verify Generated Release Artifacts
        shell: bash
        run: |
          echo "=== Generated Artifacts in release/ ==="
          ls -la release/
          if [ ! -f release/latest.yml ]; then
            echo "::error::release/latest.yml was not generated!"
            exit 1
          fi
          EXE_COUNT=$(find release -maxdepth 1 -name "*.exe" | wc -l)
          if [ "$EXE_COUNT" -eq 0 ]; then
            echo "::error::No .exe binaries generated in release/!"
            exit 1
          fi
          echo "Verification passed: $EXE_COUNT exe binary file(s) and latest.yml found."

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: PM Tool ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
